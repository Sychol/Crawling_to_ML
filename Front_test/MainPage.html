<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Voice - 아이 안전 서비스</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="logo.png" alt="Safe Voice 로고">
                <div class="logo-text">Safe Voice</div>
            </div>
            <div class="profile-icon">
                <img src="Mom.png" alt="프로필">
            </div>
            <div class="menu-icon">
                <i class="fas fa-bars"></i>
            </div>
        </header>

        <section class="main-title">
            <h1>아이가 하교할 시간이에요<br>통화 한 번 어떠세요?</h1>
            <div class="child-profiles">
                <div class="child-profile">
                    <img src="child1.png" alt="아이 1">
                    <span class="notification">1</span>
                </div>
                <div class="child-profile">
                    <img src="child2.png" alt="아이 2">
                    <span class="notification">1</span>
                </div>
                <div class="child-profile">
                    <img src="child3.png" alt="아이 3">
                </div>
            </div>
        </section>

        <hr class="divider">

        <section class="content">
            <div class="profile-section">
                <div class="profile-image">
                    <img src="child1.png" alt="나첫째">
                </div>
                <div class="profile-info">
                    <h2>나첫째</h2>
                    <p>마지막 알림</p>
                    <p class="time">2025년 4월 10일</p>
                    <p class="time">AM:10:42:33</p>
                </div>
            </div>

            <div class="weather-section">
                <h3>아이 날씨</h3>
                <div class="weather-icon">
                    <img src="sunny.png" alt="날씨">
                </div>
            </div>
        </section>

        <section class="action-buttons">
            <div class="action-button">
                <div class="button-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <span>위치확인</span>
            </div>
            <div class="action-button">
                <div class="button-icon">
                    <i class="fas fa-phone-alt"></i>
                </div>
                <span>전화걸기</span>
            </div>
            <div class="action-button">
                <div class="button-icon">
                    <i class="fas fa-bell"></i>
                    <span class="badge">1</span>
                </div>
                <span>알림내역확인</span>
            </div>
        </section>

        <section class="alerts-section">
            <div class="alerts-container">
                <div class="alert alert-sos">
                    <span class="alert-icon">!</span>
                    <span class="alert-text">SOS 알림</span>
                    <span class="alert-count">1회</span>
                </div>
                <div class="alert alert-warning">
                    <span class="alert-icon">!</span>
                    <span class="alert-text">경고 알림</span>
                    <span class="alert-count">2회</span>
                </div>
                <div class="alert alert-caution">
                    <span class="alert-icon">!</span>
                    <span class="alert-text">주의 알림</span>
                    <span class="alert-count">4회</span>
                </div>
            </div>
        </section>

        <footer>
            <div class="nav-button active">
                <i class="fas fa-home"></i>
            </div>
            <div class="nav-button">
                <i class="fas fa-bell"></i>
            </div>
            <div class="nav-button">
                <i class="fas fa-bars"></i>
            </div>
        </footer>
    </div>

    <script src="./script.js"></script>
</body>
</html>
